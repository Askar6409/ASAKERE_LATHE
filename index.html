<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>تراشکاری عساکره</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <div class="invoice-card" id="invoiceCard">
      <div class="header">
        <h1>تراشکاری عساکره </h1>
        <h2>فاکتور </h2>
        <div class="date-row">
          <div class="date-row">
  <span>تاریخ:</span>
  <span id="current-date"></span>
  <span>ساعت:</span>
  <span id="current-time"></span>
</div>

        </div>
      </div>

      <div class="customer-box no-print">
        <label for="customerName">نام مشتری:</label>
        <input type="text" id="customerName" placeholder="مثلاً عباس عساکره" />
      </div>
<!-- در بخش اطلاعات مشتری در هدر -->
<input type="text" id="customerName" placeholder="نام مشتری">
<input type="tel" id="customerPhone" placeholder="شماره موبایل">

<!-- در انتهای فایل، قبل از بستن تگ body -->
<div id="history-section">
    <h3>سوابق فاکتورها</h3>
    <div id="history-list"></div>
</div>

      <div class="table-head">
        <span>ردیف</span>
        <span>محصول / خدمت</span>
        <span>قیمت</span>
        <span>عملیات</span>
      </div>

      <div id="services-list"></div>

      <div class="add-box no-print">
        <input type="text" id="newServiceName" placeholder="نام خدمت جدید" />
        <input type="number" id="newServicePrice" placeholder="قیمت" />
        <button id="addServiceBtn">افزودن خدمت</button>
      </div>

      <div class="total-box">
        <span>مجموع:</span>
        <strong id="total-display">0 تومان</strong>
      </div>

      <div class="actions no-print">
        
        <button id="smsBtn">متن SMS</button>
        <button id="resetBtn" class="danger">پاک کردن</button>
      </div>

      <textarea id="smsText" class="sms-box no-print" readonly></textarea>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
